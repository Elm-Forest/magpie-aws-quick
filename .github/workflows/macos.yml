name: Build Magpie Quick macOS
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test proxy and model/tool bridge
        run: npm test
      - name: Download and combine Node runtimes
        shell: bash
        run: |
          set -euo pipefail
          VERSION=v24.11.1
          mkdir -p build/node
          for ARCH in arm64 x64; do
            curl --fail --location --retry 3 --silent --show-error \
              "https://nodejs.org/dist/$VERSION/node-$VERSION-darwin-$ARCH.tar.gz" \
              -o "build/node/$ARCH.tgz"
            mkdir -p "build/node/$ARCH"
            tar xzf "build/node/$ARCH.tgz" -C "build/node/$ARCH" --strip-components=1
          done
          lipo -create build/node/arm64/bin/node build/node/x64/bin/node -output build/node/node
          chmod +x build/node/node
          lipo -archs build/node/node
      - name: Build native SwiftUI universal app
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          mkdir -p build/MagpieQuick.app/Contents/{MacOS,Resources}
          for ARCH in arm64 x86_64; do
            swiftc -parse-as-library -O -sdk "$SDK" \
              -target "$ARCH"-apple-macosx13.0 \
              macos/MagpieQuickApp.swift -o "build/gui-$ARCH"
          done
          lipo -create build/gui-arm64 build/gui-x86_64 \
            -output build/MagpieQuick.app/Contents/MacOS/MagpieQuick
          cp macos/Info.plist build/MagpieQuick.app/Contents/Info.plist
          mkdir -p build/MagpieQuick.app/Contents/Resources/{app/bin,app/lib,runtime}
          cp build/node/node build/MagpieQuick.app/Contents/Resources/runtime/node
          cp bin/*.mjs build/MagpieQuick.app/Contents/Resources/app/bin/
          cp lib/*.mjs build/MagpieQuick.app/Contents/Resources/app/lib/
          cp package.json LICENSE build/MagpieQuick.app/Contents/Resources/app/
          cp build/node/arm64/LICENSE build/MagpieQuick.app/Contents/Resources/runtime/LICENSE.node
          codesign --force --deep --sign - build/MagpieQuick.app
          codesign --verify --deep --strict build/MagpieQuick.app
          lipo -archs build/MagpieQuick.app/Contents/MacOS/MagpieQuick
          lipo -archs build/MagpieQuick.app/Contents/Resources/runtime/node
      - name: Smoke-test packaged runtime
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE=build/MagpieQuick.app/Contents/Resources
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          MAGPIE_QUICK_DATA_DIR="$TMP" "$BUNDLE/runtime/node" \
            "$BUNDLE/app/bin/manage.mjs" list > "$TMP/accounts.json"
          grep -q '"accounts":\[\]' "$TMP/accounts.json"
          PORT=34567 HOST=127.0.0.1 PROXY_TOKEN=ci-smoke \
          MAGPIE_QUICK_DATA_DIR="$TMP" "$BUNDLE/runtime/node" \
            "$BUNDLE/app/bin/serve.mjs" > "$TMP/server.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || :; wait "$PID" 2>/dev/null || :; rm -rf "$TMP"' EXIT
          for i in {1..35}; do
            if curl -fsS --max-time 2 -o /dev/null http://127.0.0.1:34567/health; then break; fi
            sleep .2
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:34567/v1/models)" = "401"
          curl -fsS -H 'x-api-key: ci-smoke' -H 'anthropic-version: 2023-06-01' \
            http://127.0.0.1:34567/v1/models | grep -q '"has_more":false'
      - name: Package DMG and ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/dist build/dmg
          ditto build/MagpieQuick.app build/dmg/MagpieQuick.app
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname "Magpie Quick" -srcfolder build/dmg \
            -format UDZO -ov build/dist/MagpieQuick-macOS-universal.dmg
          ditto -c -k --sequesterRsrc --keepParent \
            build/MagpieQuick.app build/dist/MagpieQuick-macOS-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MagpieQuick-macOS
          path: build/dist/*
          retention-days: 14
      - name: Publish preview release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view macos-preview >/dev/null 2>&1; then
            gh release create macos-preview --prerelease --title "macOS Preview" \
              --notes "Native macOS App; bundled Node runtime; OAuth and OpenAI/Anthropic APIs."
          fi
          gh release upload macos-preview build/dist/* --clobber
